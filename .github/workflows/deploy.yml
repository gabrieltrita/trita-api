name: Deploy

on:
  push:
    branches: [ main ]
    tags: [ "[0-9]+.[0-9]+.[0-9]+" ]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to prepare and set up with bin/kamal setup
        type: choice
        options: [ staging, production ]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  staging:
    if: >-
      vars.STAGING_DEPLOY_HOST != '' &&
      ((github.event_name == 'push' && github.ref_type == 'branch') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.environment == 'staging'))
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      KAMAL_REGISTRY_USERNAME: ${{ github.repository_owner }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_HOST: ${{ vars.STAGING_DEPLOY_HOST }}
      DEPLOY_SSH_USER: ${{ vars.STAGING_DEPLOY_SSH_USER || 'root' }}
      DEPLOY_ARCH: ${{ vars.STAGING_DEPLOY_ARCH || 'amd64' }}
      APP_HOST: ${{ vars.STAGING_APP_HOST }}
      CORS_ORIGINS: ${{ vars.STAGING_CORS_ORIGINS }}
      FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
      MAILER_FROM: ${{ vars.STAGING_MAILER_FROM }}
      SMTP_ADDRESS: ${{ vars.STAGING_SMTP_ADDRESS }}
      SMTP_PORT: ${{ vars.STAGING_SMTP_PORT || '587' }}
      GOOGLE_CLIENT_IDS: ${{ vars.STAGING_GOOGLE_CLIENT_IDS }}
      APPLE_CLIENT_IDS: ${{ vars.STAGING_APPLE_CLIENT_IDS }}
      STAGING_SECRET_KEY_BASE: ${{ secrets.STAGING_SECRET_KEY_BASE }}
      STAGING_JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
      STAGING_AR_ENCRYPTION_PRIMARY_KEY: ${{ secrets.STAGING_AR_ENCRYPTION_PRIMARY_KEY }}
      STAGING_AR_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.STAGING_AR_ENCRYPTION_DETERMINISTIC_KEY }}
      STAGING_AR_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.STAGING_AR_ENCRYPTION_KEY_DERIVATION_SALT }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
      STAGING_SIDEKIQ_REDIS_URL: ${{ secrets.STAGING_SIDEKIQ_REDIS_URL }}
      STAGING_SIDEKIQ_WEB_USERNAME: ${{ secrets.STAGING_SIDEKIQ_WEB_USERNAME }}
      STAGING_SIDEKIQ_WEB_PASSWORD: ${{ secrets.STAGING_SIDEKIQ_WEB_PASSWORD }}
      STAGING_SMTP_USERNAME: ${{ secrets.STAGING_SMTP_USERNAME }}
      STAGING_SMTP_PASSWORD: ${{ secrets.STAGING_SMTP_PASSWORD }}
      STAGING_SENTRY_DSN: ${{ secrets.STAGING_SENTRY_DSN }}
      STAGING_APPLE_TEAM_ID: ${{ secrets.STAGING_APPLE_TEAM_ID }}
      STAGING_APPLE_KEY_ID: ${{ secrets.STAGING_APPLE_KEY_ID }}
      STAGING_APPLE_PRIVATE_KEY: ${{ secrets.STAGING_APPLE_PRIVATE_KEY }}
      STAGING_POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
      STAGING_REDIS_PASSWORD: ${{ secrets.STAGING_REDIS_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/kamal-deploy
        with:
          destination: staging
          setup: ${{ github.event_name == 'workflow_dispatch' }}
          ssh-private-key: ${{ secrets.STAGING_DEPLOY_SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.STAGING_DEPLOY_SSH_KNOWN_HOSTS }}
          health-url: https://${{ vars.STAGING_APP_HOST }}/health

  production:
    if: >-
      vars.DEPLOY_HOST != '' &&
      ((github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.environment == 'production'))
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      KAMAL_REGISTRY_USERNAME: ${{ github.repository_owner }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER || 'root' }}
      DEPLOY_ARCH: ${{ vars.DEPLOY_ARCH || 'amd64' }}
      APP_HOST: ${{ vars.APP_HOST }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      MAILER_FROM: ${{ vars.MAILER_FROM }}
      SMTP_ADDRESS: ${{ vars.SMTP_ADDRESS }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      GOOGLE_CLIENT_IDS: ${{ vars.GOOGLE_CLIENT_IDS }}
      APPLE_CLIENT_IDS: ${{ vars.APPLE_CLIENT_IDS }}
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      AR_ENCRYPTION_PRIMARY_KEY: ${{ secrets.AR_ENCRYPTION_PRIMARY_KEY }}
      AR_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.AR_ENCRYPTION_DETERMINISTIC_KEY }}
      AR_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.AR_ENCRYPTION_KEY_DERIVATION_SALT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      SIDEKIQ_REDIS_URL: ${{ secrets.SIDEKIQ_REDIS_URL }}
      SIDEKIQ_WEB_USERNAME: ${{ secrets.SIDEKIQ_WEB_USERNAME }}
      SIDEKIQ_WEB_PASSWORD: ${{ secrets.SIDEKIQ_WEB_PASSWORD }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: ./.github/actions/kamal-deploy
        with:
          setup: ${{ github.event_name == 'workflow_dispatch' }}
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          health-url: https://${{ vars.APP_HOST }}/health
