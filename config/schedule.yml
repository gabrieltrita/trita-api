maintenance_cleanup:
  cron: "0 6 * * *"
  class: "MaintenanceCleanupJob"
  queue: default
  description: "Remove refresh tokens expirados e cadastros não confirmados"

payment_reconciliation:
  cron: "15 * * * *"
  class: "PaymentReconciliationJob"
  queue: default
  description: "Syncs pending payments that have not changed recently"
